<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Entreno</title>
<style>
:root{--bg:#111418;--card:#1b2027;--card2:#232a33;--txt:#eef1f5;--mut:#8f9bab;--acc:#3ddc97;--acc2:#2a9d6c;--warn:#ffb84d;--line:#2d3641}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,Roboto,sans-serif}
body{padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
h1{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
h1 small{color:var(--mut);font-weight:400;font-size:12px}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;font-size:14px;font-weight:600;text-align:center}
.tab.on{background:var(--acc);color:#06281a;border-color:var(--acc)}
.tab span{display:block;font-size:10px;font-weight:400;opacity:.8}
main{padding:12px;max-width:640px;margin:0 auto}
.dayhead{margin:4px 0 12px}
.dayhead h2{margin:0;font-size:19px}
.dayhead p{margin:2px 0 0;color:var(--mut);font-size:13px}
.prog{height:6px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ex.done{border-color:var(--acc2)}
.exh{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.num{background:var(--card2);color:var(--acc);min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.ex.done .num{background:var(--acc);color:#06281a}
.exh b{display:block;font-size:16px}
.meta{color:var(--mut);font-size:13px}
.meta em{font-style:normal;color:var(--warn)}
.last{font-size:12px;color:var(--mut);margin-top:3px}
.body{padding:0 14px 14px;display:none}
.ex.open .body{display:block}
.row{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.row.t{grid-template-columns:26px 1fr 44px}
.row .s{color:var(--mut);text-align:center;font-size:13px}
input[type=number],textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:11px 8px;font-size:17px;font-family:inherit}
input[type=number]{text-align:center}
input:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
textarea{font-size:15px;min-height:64px;resize:vertical;margin-top:4px}
.chk{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card2);color:transparent;font-size:22px;font-weight:700}
.chk.on{background:var(--acc);border-color:var(--acc);color:#06281a}
.lbl{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;color:var(--mut);font-size:11px;text-align:center;margin-bottom:4px}
.lbl.t{grid-template-columns:26px 1fr 44px}
.tip{font-size:12px;color:var(--mut);margin:0 0 8px}
.btn{background:var(--acc);color:#06281a;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;width:100%;margin-top:6px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600;font-size:14px;padding:11px}
.small{display:flex;gap:8px;margin-top:8px}
.small .btn{margin:0}
.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.hist b{color:var(--acc)}
.hist .ln{color:var(--mut);margin-top:2px}
h3{margin:18px 0 8px;font-size:15px}
.notes{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut)}
.notes b{color:var(--txt)}
#timer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:9}
#timer .t{font-size:24px;font-weight:700;min-width:70px;font-variant-numeric:tabular-nums}
#timer .t.end{color:var(--warn)}
#timer button{flex:1;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 0;font-weight:600;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>💪 Entreno <small id="wk"></small></h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div id="timer">
  <div class="t" id="tt">0:00</div>
  <button data-s="60">60s</button><button data-s="90">90s</button><button data-s="150">2:30</button><button data-s="0">⏹</button>
</div>

<script>
const DAYS=[
{id:"d1",tab:"Lun",title:"Día 1 · Cuerpo completo A",sub:"Fuerza base",ex:[
 ["Sentadilla (barra, goblet o prensa)",3,"6-8","1-2"],
 ["Press plano (barra o mancuernas)",3,"6-8","1-2"],
 ["Remo con apoyo al pecho (mancuernas, banco 45°)",3,"8-10","1-2"],
 ["Press hombro sentado (mancuernas o máquina)",2,"8-10","1-2"],
 ["Curl femoral (sentado o tumbado)",2,"10-12","0-1"],
 ["Curl martillo cruzado",2,"10-12","0-1"],
 ["Extensión de tríceps en polea (soga)",2,"10-12","0-1"]]},
{id:"d2",tab:"Mar",title:"Día 2 · Cuerpo completo B",sub:"Bisagra y espalda vertical",ex:[
 ["Peso muerto rumano (barra o mancuernas)",3,"6-8","1-2"],
 ["Jalón al pecho agarre abierto",3,"8-10","1"],
 ["Press inclinado (mancuernas)",3,"8-10","1-2"],
 ["Elevaciones laterales sentado (mancuernas)",3,"12-15","0-1"],
 ["Face pull (sostener 2 s atrás)",3,"12-15","1"],
 ["Curl inclinado en banco 45°",3,"10-12","0-1"],
 ["Plancha",3,"45-60 s","",true]]},
{id:"d3",tab:"Jue",title:"Día 3 · Cuerpo completo C",sub:"Volumen moderado",ex:[
 ["Prensa de piernas",3,"8-12","1"],
 ["Fondos en paralelas (asistidos) o press en máquina",3,"8-12","1"],
 ["Remo en polea baja o máquina",3,"10-12","1"],
 ["Hip thrust (barra o máquina)",2,"8-12","1-2"],
 ["Elevaciones laterales en polea (a una mano)",3,"12-15","0-1"],
 ["Extensión de tríceps sobre la cabeza (soga o mancuerna)",3,"10-12","0-1"],
 ["Curl en banco Scott",2,"10-12","0-1"]]},
{id:"d4",tab:"Vie",title:"Día 4 · Cuerpo completo D",sub:"Unilateral y hombros",ex:[
 ["Sentadilla búlgara o zancadas con mancuernas",3,"8-10","1-2"],
 ["Jalón agarre neutro/cerrado",3,"10-12","1"],
 ["Press hombro (máquina o mancuernas)",2,"8-10","1-2"],
 ["Cruces en polea (media o baja)",3,"12-15","0-1"],
 ["Curl femoral",2,"10-12","0-1"],
 ["Elevaciones laterales (cualquier variante)",2,"15-20","0"],
 ["Face pull o pájaros (deltoide posterior)",2,"12-15","1"],
 ["Curl martillo cruzado",2,"10-12","0-1"],
 ["Plancha",3,"45-60 s","",true]]}
];
const RULES=`<b>Calentamiento:</b> 5 min cardio suave + 2 series de aproximación (50% y 75%) en el primer ejercicio.<br>
<b>Descanso:</b> 2-3 min en básicos, 60-90 s en aislamientos.<br>
<b>Progresión doble:</b> cuando llegues al tope del rango en TODAS las series con buena técnica y RIR 1-2, sube peso (2.5-5%) y vuelve al piso del rango.<br>
<b>Tempo:</b> bajar en 2-3 s, subir controlado.<br>
<b>Semanas 1-2:</b> RIR 3. <b>3-8:</b> RIR 1-2 / 0-1. <b>Semana 9:</b> descarga (50% de series, RIR 3-4).<br>
<b>Fallo total</b> solo en máquinas/poleas. Nunca en sentadilla, peso muerto ni press con barra sin seguros.`;

const KEY="entreno_v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.log)S={log:{},hist:[],tab:"d1",open:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayById=id=>DAYS.find(d=>d.id===id);

function entry(day,i,n){
  const L=S.log[day]||(S.log[day]={});
  const e=L[i]||(L[i]={sets:[],note:""});
  while(e.sets.length<n)e.sets.push({w:"",r:"",d:false});
  return e;
}
function lastOf(day,i){
  for(let k=S.hist.length-1;k>=0;k--){
    const h=S.hist[k];
    if(h.day!==day)continue;
    const e=h.data[i];
    if(e&&(e.sets.some(s=>s.w!==""||s.r!=="")||e.note))return {date:h.date,e};
  }
  return null;
}
function fmtLast(l,time){
  const parts=l.e.sets.filter(s=>s.w!==""||s.r!=="").map(s=>time?(s.r+"s"):((s.w||"-")+"kg×"+(s.r||"-")));
  const d=new Date(l.date).toLocaleDateString("es",{day:"numeric",month:"short"});
  return d+": "+parts.join(" · ")+(l.e.note?" 📝 "+l.e.note:"");
}

function renderTabs(){
  $("#tabs").innerHTML=DAYS.map(d=>`<button class="tab ${S.tab===d.id?"on":""}" data-t="${d.id}">${d.id[1]}<span>${d.tab}</span></button>`).join("")
   +`<button class="tab ${S.tab==="h"?"on":""}" data-t="h">📋<span>Hist.</span></button>`;
  const wk=S.hist.length;
  $("#wk").textContent=wk+" sesiones guardadas";
}
function render(){
  renderTabs();
  if(S.tab==="h")return renderHist();
  const d=dayById(S.tab);
  let total=0,done=0;
  const exs=d.ex.map((x,i)=>{
    const [name,n,reps,rir,time]=x;
    const e=entry(d.id,i,n);
    const dn=e.sets.slice(0,n).filter(s=>s.d).length;
    total+=n;done+=dn;
    const l=lastOf(d.id,i);
    const open=S.open[d.id+i];
    const rows=e.sets.slice(0,n).map((s,k)=>time?
      `<div class="row t"><div class="s">${k+1}</div><input type="number" inputmode="numeric" placeholder="${l&&l.e.sets[k]&&l.e.sets[k].r||"seg"}" value="${esc(s.r)}" data-i="${i}" data-k="${k}" data-f="r"><button class="chk ${s.d?"on":""}" data-i="${i}" data-k="${k}">✓</button></div>`
      :`<div class="row"><div class="s">${k+1}</div><input type="number" inputmode="decimal" step="any" placeholder="${l&&l.e.sets[k]&&l.e.sets[k].w||"kg"}" value="${esc(s.w)}" data-i="${i}" data-k="${k}" data-f="w"><input type="number" inputmode="numeric" placeholder="${l&&l.e.sets[k]&&l.e.sets[k].r||reps.split("-")[0]}" value="${esc(s.r)}" data-i="${i}" data-k="${k}" data-f="r"><button class="chk ${s.d?"on":""}" data-i="${i}" data-k="${k}">✓</button></div>`).join("");
    return `<div class="ex ${dn===n?"done":""} ${open?"open":""}">
      <div class="exh" data-o="${i}"><div class="num">${dn===n?"✓":i+1}</div>
      <div><b>${esc(name)}</b><div class="meta">${n} × ${reps}${rir?` · <em>RIR ${rir}</em>`:""} · ${dn}/${n}</div>
      ${l?`<div class="last">Última vez → ${esc(fmtLast(l,time))}</div>`:""}</div></div>
      <div class="body">
        <div class="lbl ${time?"t":""}"><span>#</span>${time?"<span>Segundos</span>":"<span>Peso (kg)</span><span>Reps</span>"}<span></span></div>
        ${rows}
        <textarea placeholder="Notas (sensaciones, técnica, ajuste de banco…)" data-n="${i}">${esc(e.note)}</textarea>
      </div></div>`;
  }).join("");
  $("#main").innerHTML=`<div class="dayhead"><h2>${esc(d.title)}</h2><p>${esc(d.sub)} · ${d.ex.length} ejercicios · ${total} series</p><div class="prog"><i style="width:${total?done/total*100:0}%"></i></div></div>
   ${exs}
   <button class="btn" id="fin">✔ Finalizar sesión y guardar</button>
   <h3>Reglas generales</h3><div class="notes">${RULES}</div>`;
}
function renderHist(){
  const items=S.hist.slice().reverse().map((h,ri)=>{
    const idx=S.hist.length-1-ri;
    const d=dayById(h.day);
    const lines=d.ex.map((x,i)=>{
      const e=h.data[i];if(!e)return"";
      const sets=e.sets.filter(s=>s.w!==""||s.r!=="").map(s=>x[4]?s.r+"s":(s.w||"-")+"×"+(s.r||"-"));
      if(!sets.length&&!e.note)return"";
      return `<div class="ln">${esc(x[0])}: ${sets.join(" · ")}${e.note?" 📝 "+esc(e.note):""}</div>`}).join("");
    return `<div class="hist"><b>${esc(d.title)}</b> · ${new Date(h.date).toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"})}${lines}<div class="small"><button class="btn sec" data-del="${idx}">Borrar</button></div></div>`}).join("");
  $("#main").innerHTML=`<div class="dayhead"><h2>Historial</h2><p>Sesiones finalizadas</p></div>${items||'<p class="meta">Aún no hay sesiones guardadas.</p>'}
   <h3>Copia de seguridad</h3>
   <div class="small"><button class="btn sec" id="exp">Exportar</button><button class="btn sec" id="imp">Importar</button></div>
   <input type="file" id="file" accept=".json" hidden>`;
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-t],[data-o],.chk,#fin,[data-del],#exp,#imp,#timer button");
  if(!t)return;
  if(t.dataset.t){S.tab=t.dataset.t;save();render();scrollTo(0,0)}
  else if(t.dataset.o!==undefined){const k=S.tab+t.dataset.o;S.open[k]=!S.open[k];save();t.parentElement.classList.toggle("open")}
  else if(t.classList.contains("chk")){
    const d=dayById(S.tab),i=+t.dataset.i,k=+t.dataset.k;
    const e=entry(d.id,i,d.ex[i][1]);e.sets[k].d=!e.sets[k].d;save();
    if(e.sets[k].d){const time=d.ex[i][4];startTimer(time?60:(parseInt(d.ex[i][2])>=10?75:150))}
    const sc=scrollY;render();scrollTo(0,sc)}
  else if(t.id==="fin"){
    const d=dayById(S.tab);
    const any=Object.values(S.log[d.id]||{}).some(e=>e.sets.some(s=>s.w!==""||s.r!==""||s.d)||e.note);
    if(!any){alert("No hay datos para guardar.");return}
    if(!confirm("¿Guardar esta sesión en el historial y limpiar el día?"))return;
    S.hist.push({date:new Date().toISOString(),day:d.id,data:JSON.parse(JSON.stringify(S.log[d.id]))});
    S.log[d.id]={};S.open={};save();S.tab="h";render();scrollTo(0,0)}
  else if(t.dataset.del!==undefined){if(confirm("¿Borrar esta sesión?")){S.hist.splice(+t.dataset.del,1);save();render()}}
  else if(t.id==="exp"){
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
    a.download="entreno-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
  else if(t.id==="imp"){$("#file").click()}
  else if(t.closest("#timer")){startTimer(+t.dataset.s)}
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="file"){
    const f=ev.target.files[0];if(!f)return;
    f.text().then(x=>{try{const j=JSON.parse(x);if(!j.log||!j.hist)throw 0;if(!confirm("Esto reemplaza los datos actuales. ¿Continuar?"))return;S=j;save();render()}catch(e){alert("Archivo no válido")}})}
});
document.addEventListener("input",ev=>{
  const t=ev.target,d=dayById(S.tab);if(!d)return;
  if(t.dataset.f){const i=+t.dataset.i;entry(d.id,i,d.ex[i][1]).sets[+t.dataset.k][t.dataset.f]=t.value;save()}
  else if(t.dataset.n!==undefined){const i=+t.dataset.n;entry(d.id,i,d.ex[i][1]).note=t.value;save()}
});

// Temporizador de descanso
let tInt,tEnd=0;
function startTimer(s){
  clearInterval(tInt);const el=$("#tt");el.classList.remove("end");
  if(!s){el.textContent="0:00";return}
  tEnd=Date.now()+s*1000;
  const tick=()=>{const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
    el.textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");
    if(r<=0){clearInterval(tInt);el.classList.add("end");try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}};
  tick();tInt=setInterval(tick,250);
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
